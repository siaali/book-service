server:
  port: 8080

spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 密码留空，本地开发没设密码
      password:
      # 连接超时时间：连不上就别傻等
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  application:
    name: book-service

  # 本地开发配置（数据库密码）放在 application-local.yml，该文件已被 .gitignore 排除。
  # optional: 前缀表示文件不存在也不报错，方便别人 clone 后直接启动（只是连不上库）。
  config:
    import: optional:file:./application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true：MySQL 8+ 默认 caching_sha2_password，不加这个会报 Public Key Retrieval is not allowed
    # rewriteBatchedStatements=true：批量插入时把多条 INSERT 合并成一条，性能提升明显
    url: jdbc:mysql://127.0.0.1:3306/book_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    # 密码不写进仓库。取值优先级：环境变量 DB_PASSWORD > application-local.yml > 空
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

mybatis-plus:
  configuration:
    # 数据库下划线字段 -> Java 驼峰属性（available_stock -> availableStock）
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线要关掉（会拖慢性能并泄漏数据）
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.siaali.book: info

# ============================================================
# 逾期检测定时任务
#
# 这里的值会覆盖 OverdueTask 里 @Scheduled 的默认值。
# 默认值写在注解里（${overdue.cron:0 0 3 * * *}），所以这里不写也能跑。
# 写在这里的目的是"让人知道有这么个东西可以调"——
# 一个只存在于注解默认值里的配置项，接手的人翻配置文件是找不到的。
#
# 临时验证时可以不改这个文件，直接用环境变量覆盖（优先级更高）：
#   OVERDUE_CRON="0 * * * * *" ./mvnw spring-boot:run
# 六个字段分别是：秒 分 时 日 月 周
# ============================================================
overdue:
  cron: "0 0 3 * * *"

